name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v4
      
      - name: Install, build, and upload your site
        uses: withastro/action@v3
        with:
          # Optional: specify if you're using a specific setup
          # path: .                        # Set if Astro project is in a subfolder
          node-version: 18                 # Lock to Node.js 18 (since you mentioned that earlier)
          package-manager: npm@latest      # Use npm, or replace with pnpm/yarn if needed

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      # 💡 This line is *optional* and won't break things, but may be removed for clarity
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
